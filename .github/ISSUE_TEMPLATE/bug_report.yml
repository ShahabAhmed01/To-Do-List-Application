name: Bug report
description: Report a reproducible problem with TaskFlow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first and do
        not include secrets, tokens, or private data.

        Security issues must be reported privately as described in
        [SECURITY.md](https://github.com/ShahabAhmed01/To-Do-List-Application/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact menu choices and text you entered.
      placeholder: |
        1. Build with ...
        2. Run ...
        3. Choose option 1
        4. Enter ...
        5. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error text. Redact anything private.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: g++ 16.2.0 (MinGW-W64), MSVC 19.4x, ...
    validations:
      required: true
  - type: input
    id: build-command
    attributes:
      label: Build command
      placeholder: g++ -std=c++17 -O2 -o taskflow.exe "To-Do List Application.cpp"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, terminal recordings, or anything else that helps.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am willing to test a proposed fix.
          required: false
