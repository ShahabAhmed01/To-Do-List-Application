name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -o taskflow "To-Do List Application.cpp"

      - name: Smoke test
        run: bash tests/smoke_test.sh ./taskflow

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /WX
          "To-Do List Application.cpp" /Fe:taskflow.exe

      - name: Smoke test
        shell: pwsh
        run: ./tests/smoke_test.ps1 -Binary ./taskflow.exe
